services:
  db:
    image: postgres:16-alpine
    container_name: pay365-db
    environment:
      POSTGRES_USER: pay365
      POSTGRES_PASSWORD: pay365
      POSTGRES_DB: pay365
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pay365 -d pay365"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: pay365-api
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://pay365:pay365@db:5432/pay365
      SESSION_SECRET: 4aefb68d29c3a1290e4f35b2341b5d63f89e210a47d3d1984c3c92170a4efb3c
      SESSION_MAX_AGE_DAYS: 7
      WEB_ORIGIN: http://localhost:5173
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm run db:seed && npm run dev"

  web:
    build: ./frontend
    container_name: pay365-web
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
